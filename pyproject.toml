[project]
name = "gmail-automation"
version = "0.1.0"
description = "Gmail Automatisierungs-Tool ueber die Gmail API"
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.30,<3.0",
    "google-auth-oauthlib>=1.0,<2.0",
    "google-api-python-client>=2.100,<3.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.31,<3.0",
    "openai>=1.0.0",
    "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
gmail-bot = "main:main"
